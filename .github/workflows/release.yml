name: release

# 仅手动发布 GitHub Release（必然关联一个 tag）时触发；
# 普通 push / PR / 直接打 tag 但不发布 Release 都不会触发。
on:
  release:
    types: [published]

permissions:
  contents: write   # 上传二进制到 Release 资产
  packages: write   # 推送镜像到 ghcr.io

env:
  GO_VERSION: "1.22"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hd-icons-go/go.sum

      - name: Build linux/amd64
        working-directory: hd-icons-go
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o hd-icons-linux-amd64 .

      - name: Attach binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: hd-icons-go/hd-icons-linux-amd64

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io 镜像名必须全小写，仓库名含大写时需转小写
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # Release 必然带 tag：tag 名 + latest
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: hd-icons-go
          file: hd-icons-go/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
